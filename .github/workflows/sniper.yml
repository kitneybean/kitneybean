name: 🎯 activity range

on:
  schedule:
    - cron: "23 */6 * * *" # fresh intel every 6 hours
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/workflows/sniper.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: activity-range
  cancel-in-progress: true

jobs:
  build:
    # scheduled runs always use the default branch; pushes only count there too
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the sniper SVGs
        run: node scripts/generate-sniper.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the interactive range
        run: cp -r site/. dist/

      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "🎯 update activity range"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Stays green until Pages is switched on (Settings → Pages → Source: GitHub Actions);
    # the README animation works without it.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
